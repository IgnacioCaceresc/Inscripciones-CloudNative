name: Deploy to AWS EC2

# El pipeline se activará cada vez que hagas un "git push" a la rama main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Descarga tu código en el servidor de GitHub
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Configura Java 21 (la versión que tienes en tu pom.xml)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Compila el proyecto y genera el archivo .jar (omitiendo tests para evitar errores de conexión)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Se conecta a tu Docker Hub usando los Secrets que guardamos
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Crea la imagen de Docker y la sube a la nube (Docker Hub)
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/learning-platform:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/learning-platform:latest

      # 6. Se conecta a tu servidor AWS (EC2) y lanza la aplicación
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.USER_SERVER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Pasamos las credenciales de AWS al contenedor para que S3 funcione
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
          script: |
            # Descargar la última versión de la imagen
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/learning-platform:latest
            # Detener y borrar el contenedor si ya existe uno corriendo
            docker stop learning-app || true
            docker rm learning-app || true
            # Iniciar el nuevo contenedor con las llaves de AWS inyectadas
            docker run -d --name learning-app \
              -p 8080:8080 \
              -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
              -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
              -e AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/learning-platform:latest
              